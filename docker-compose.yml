version: "3"
services:
  web:
    container_name: Front
    image: node:18.18-alpine3.17
    restart: unless-stopped
    working_dir: /usr/src/app
    # command: sh -c "yarn install && yarn run dev"
    command: sh -c "yarn run dev"
    # env_file: .env
    environment:
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED}
      PORT: ${NEXT_PORT}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./web:/usr/src/app
    ports:
      - ${NEXT_PORT}:${NEXT_PORT}
    networks: 
      - unipopular

  backend:
    container_name: backend
    image: backend
    build:
      context: ./backend
      dockerfile: backend.dockerfile
    ports:
      - 4000:4000
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks: 
      - unipopular
      
  postgres:
    container_name: DB
    image: postgres:16-alpine3.18
    restart: unless-stopped
    command: -p ${DB_PORT}
    # env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ./datadb/postgres:/var/lib/postgresql/data
      - ./datadb/dump:/dump
    ports: 
      - ${DB_PORT}:${DB_PORT}
    networks: 
      - unipopular

  pgadmin:
    image: dpage/pgadmin4:8.5
    container_name: bdd_pg_admin
    restart: always
    environment:
        PGADMIN_DEFAULT_EMAIL: admin@gmail.com
        PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
        - "5050:80"
    networks: 
      - unipopular

networks: 
  unipopular:
    name: UniPopular
    driver: bridge
